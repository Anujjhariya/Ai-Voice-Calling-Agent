<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI PDF Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: 'Segoe UI', sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
            position: relative;

            background:
                linear-gradient(135deg,
                    #fff7ed 0%,
                    #ffe0b2 35%,
                    #ffffff 70%,
                    #fff3e0 100%);
        }

        /* =========================
BACKGROUND BUBBLES
========================= */

        .bg-bubbles {

            position: absolute;

            width: 100%;
            height: 100%;

            top: 0;
            left: 0;

            overflow: hidden;

            z-index: 0;
        }

        .bg-bubbles span {

            position: absolute;

            border-radius: 50%;

            background: rgba(255, 140, 0, 0.18);

            backdrop-filter: blur(4px);

            animation: float 18s infinite ease-in-out;
        }

        /* TOP LEFT */

        .bg-bubbles span:nth-child(1) {

            width: 180px;
            height: 180px;

            top: -40px;
            left: -40px;

            animation-duration: 18s;
        }

        /* TOP RIGHT */

        .bg-bubbles span:nth-child(2) {

            width: 260px;
            height: 260px;

            top: -80px;
            right: -80px;

            animation-duration: 22s;
        }

        /* CENTER LEFT */

        .bg-bubbles span:nth-child(3) {

            width: 120px;
            height: 120px;

            top: 40%;
            left: -30px;

            animation-duration: 16s;
        }

        /* CENTER RIGHT */

        .bg-bubbles span:nth-child(4) {

            width: 150px;
            height: 150px;

            top: 55%;
            right: -40px;

            animation-duration: 20s;
        }

        /* BOTTOM LEFT */

        .bg-bubbles span:nth-child(5) {

            width: 220px;
            height: 220px;

            bottom: -90px;
            left: 10%;

            animation-duration: 24s;
        }

        /* BOTTOM RIGHT */

        .bg-bubbles span:nth-child(6) {

            width: 170px;
            height: 170px;

            bottom: -50px;
            right: 5%;

            animation-duration: 19s;
        }

        /* CENTER WHITE BUBBLE */

        .bg-bubbles span:nth-child(7) {

            width: 90px;
            height: 90px;

            top: 20%;
            left: 45%;

            background: rgba(255, 255, 255, 0.5);

            animation-duration: 15s;
        }

        /* FLOAT */

        @keyframes float {

            0% {
                transform: translateY(0px) translateX(0px);
            }

            50% {
                transform: translateY(-30px) translateX(10px);
            }

            100% {
                transform: translateY(0px) translateX(0px);
            }
        }

        /* =========================
MAIN CHATBOX
========================= */

        .box {

            width: 520px;

            height: 88vh;

            background: rgba(255, 255, 255, 0.45);

            backdrop-filter: blur(16px);

            border-radius: 25px;

            padding: 16px;

            display: flex;
            flex-direction: column;

            box-shadow: 0 10px 40px rgba(255, 140, 0, 0.15);

            border: 1px solid rgba(255, 165, 0, 0.2);

            z-index: 2;
        }

        /* =========================
HEADER
========================= */

        .header {

            text-align: center;

            margin-bottom: 10px;
        }

        .header h2 {

            color: #ea580c;

            font-size: 28px;
        }

        .header p {

            color: #555;

            font-size: 13px;
        }



        /* =========================
BUTTONS
========================= */

        button {

            background:
                linear-gradient(135deg,
                    #ff9800,
                    #ff6d00);

            border: none;

            color: white;

            padding: 10px 18px;

            border-radius: 12px;

            cursor: pointer;

            margin-top: 8px;

            font-weight: 600;

            transition: 0.3s;
        }

        button:hover {

            transform: scale(1.05);

            opacity: 0.95;
        }

        /* =========================
CHAT AREA
========================= */

        #chat {

            flex: 1;

            overflow-y: auto;

            background: rgba(255, 255, 255, 0.35);

            border-radius: 18px;

            padding: 12px;

            border: 1px solid rgba(255, 165, 0, 0.15);
        }

        .user,
        .bot {

            margin: 10px 0;

            display: flex;
        }

        .user {

            justify-content: flex-end;
        }

        .bot {

            justify-content: flex-start;
        }

        .bubble {

            padding: 12px;

            border-radius: 15px;

            max-width: 80%;

            line-height: 1.5;

            word-wrap: break-word;

            font-size: 14px;
        }

        /* USER */

        .user .bubble {

            background:
                linear-gradient(135deg,
                    #ff9800,
                    #ff6d00);

            color: white;
        }

        /* BOT */

        .bot .bubble {

            background: white;

            color: #333;

            border: 1px solid rgba(255, 165, 0, 0.2);
        }

        /* =========================
INPUT AREA
========================= */

        .input-area {

            display: flex;

            gap: 10px;

            margin-top: 10px;
        }

        .input-area input {

            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 12px;

            outline: none;

            background: white;

            border: 1px solid rgba(255, 165, 0, 0.2);
        }
    </style>

</head>

<body>

    <!-- BUBBLES -->

    <div class="bg-bubbles">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <!-- CHATBOT -->

    <div class="box">

        <div class="header">

            <h2>🤖 AI PDF Chatbot</h2>

            <p>Ask anything from your PDFs</p>

        </div>



        <!-- Chat -->

        <div id="chat"></div>

        <!-- Input -->

        <div class="input-area">

            <input type="text" id="msg" placeholder="Ask your question...">

            <button onclick="send()">
                Send
            </button>

        </div>

    </div>

    <script>



        async function send() {

            let msgInput = document.getElementById("msg");

            let msg = msgInput.value.trim();

            if (!msg) return;

            let chat = document.getElementById("chat");

            chat.innerHTML += `
        <div class="user">
            <div class="bubble">${msg}</div>
        </div>
    `;

            msgInput.value = "";

            chat.scrollTop = chat.scrollHeight;

            let typingId = "typing_" + Date.now();

            chat.innerHTML += `
        <div class="bot" id="${typingId}">
            <div class="bubble">Typing...</div>
        </div>
    `;

            chat.scrollTop = chat.scrollHeight;

            try {

                let response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: msg
                    })
                });

                let data = await response.json();

                document.getElementById(typingId).remove();

                chat.innerHTML += `
            <div class="bot">
                <div class="bubble">
                    ${data.response || data.error}
                </div>
            </div>
        `;

                chat.scrollTop = chat.scrollHeight;

            }

            catch (error) {

                console.log(error);

                alert("Error");
            }
        }

        document
            .getElementById("msg")
            .addEventListener("keypress", function (event) {

                if (event.key === "Enter") {

                    send();
                }
            });

    </script>

    <!-- Embedded AI Voice Widget -->
    <script>
      window.BinjwaWidgetConfig = {
        lang: "hi",
        position: "right",
        primaryColor: "#ff9800", // Orange color to match the chatbot theme
        accentColor: "#ff6d00"
      };
    </script>
    <script src="/static/widget.js"></script>

</body>

</html>
